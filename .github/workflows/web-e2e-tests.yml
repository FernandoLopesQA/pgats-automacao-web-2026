name: Web E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # Clone do projeto para a máquina
      - uses: actions/checkout@v4

      # Conferir a versão instalada
      - name: Node version
        run: node --version

      - name: Instalando dependências
        run: npm install

      - name: Executando os testes
        run: npx cypress run

      - name: Exibir resultados no GitHub Actions
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Testes E2E
          path: cypress/reports/junit/*.xml
          reporter: java-junit
          use-actions-summary: 'true'
          list-suites: all
          list-tests: all
          fail-on-error: 'true'
          fail-on-empty: 'true'

      - name: Disponibilizar relatório e evidências
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-mochawesome
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          if-no-files-found: error
          retention-days: 30
